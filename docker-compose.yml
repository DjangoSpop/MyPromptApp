version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: promptcraft_db
    environment:
      POSTGRES_DB: ${DB_NAME:-promptcraft}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promptcraft_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: promptcraft_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promptcraft_network

  # Django Backend
  backend:
    build:
      context: ./my_prmpt_bakend
      dockerfile: Dockerfile
    container_name: promptcraft_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn promptcraft.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    environment:
      - DJANGO_SETTINGS_MODULE=promptcraft.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-promptcraft}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - ./my_prmpt_bakend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promptcraft_network

  # Celery Worker
  celery:
    build:
      context: ./my_prmpt_bakend
      dockerfile: Dockerfile
    container_name: promptcraft_celery
    command: celery -A promptcraft worker -l info --concurrency=4
    environment:
      - DJANGO_SETTINGS_MODULE=promptcraft.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-promptcraft}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./my_prmpt_bakend:/app
    depends_on:
      - redis
      - postgres
    networks:
      - promptcraft_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./my_prmpt_bakend
      dockerfile: Dockerfile
    container_name: promptcraft_celery_beat
    command: celery -A promptcraft beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=promptcraft.settings.production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-promptcraft}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./my_prmpt_bakend:/app
    depends_on:
      - redis
      - postgres
    networks:
      - promptcraft_network

  # Nginx (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: promptcraft_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
    networks:
      - promptcraft_network
    profiles:
      - production

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  promptcraft_network:
    driver: bridge
